<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Management Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
    header {
      background: linear-gradient(135deg, #1a4731, #276749);
      color: white; padding: 1.2rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header p  { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
    nav { background: #1e4d36; display: flex; gap: 0; }
    nav a { color: #a7f3d0; text-decoration: none; padding: 0.65rem 1.4rem;
            font-size: 0.88rem; display: block; transition: background 0.2s; }
    nav a:hover, nav a.active { background: #276749; color: white; }
    .badge { background: #6ee7b7; color: #064e3b; font-size: 0.7rem;
             padding: 2px 10px; border-radius: 12px; font-weight: 700; }
    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🏥 City Hospital Management Portal</h1>
      <p>Subject Code: 24CS2018 – DevOps Project | Semester VII CSE (2025–2026)</p>
    </div>
    <span class="badge">LIVE on AKS</span>
  </header>
  <nav>
    <a href="/" class="{% if request.path == '/' %}active{% endif %}">🏠 Dashboard</a>
    <a href="/doctors" class="{% if request.path == '/doctors' %}active{% endif %}">👨‍⚕️ Doctors</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
